<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiting Dashboard</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --ink:#e6e9ef; --muted:#9aa3b2; --accent:#6ea8fe; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --chip:#232834;
  }
  @media (prefers-color-scheme:light){
    :root{ --bg:#f6f7f9; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e6ec;
      --ink:#1a1d23; --muted:#5b6472; --accent:#2563eb; --chip:#eef1f5; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12.5px}
  nav{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550}
  nav button:hover{color:var(--ink);background:var(--panel2)}
  nav button.active{color:var(--ink);background:var(--panel);border-color:var(--line)}
  main{padding:22px 24px;max-width:1080px;margin:0 auto}
  .tab{display:none}.tab.active{display:block}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h3{margin:0 0 8px;font-size:14px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .n{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--muted);margin:2px 3px 0 0}
  .score{font-weight:700;font-size:15px}
  .g{color:var(--good)}.w{color:var(--warn)}.b{color:var(--bad)}.m{color:var(--muted)}
  .bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .note{color:var(--muted);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 16px}
  .title{font-weight:600}.mut{color:var(--muted);font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .pill.on{background:rgba(74,222,128,.15);color:var(--good)}
  .pill.off{background:rgba(251,191,36,.15);color:var(--warn)}
  .wrap{overflow-x:auto}
  .empty{color:var(--muted);padding:14px 0}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn.sm{padding:4px 12px;font-size:12px}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  a.view{color:var(--accent);text-decoration:none;font-size:12.5px}
  @media (max-width:560px){
    main{padding:16px 13px}header{padding:14px 16px}
    .row{flex-direction:column;align-items:flex-start;gap:6px}
    .row>div:last-child{text-align:left!important;min-width:0!important}
    .kpi .n{font-size:22px}
    nav{padding:8px 10px}nav button{padding:6px 10px}
  }
</style>
</head>
<body>
<header>
  <h1>Recruiting Dashboard</h1>
  <span class="sub" id="sub">loading…</span>
</header>
<nav id="nav"></nav>
<main>
  <div class="tab" id="t-start"></div>
  <div class="tab" id="t-resume"></div>
  <div class="tab" id="t-goals"></div>
  <div class="tab" id="t-jobs"></div>
  <div class="tab" id="t-system"></div>
</main>
<script>
const TABS=[["start","Start Here"],["jobs","Jobs"],["resume","Resumes"],["goals","Goals"],["system","System Health"]];
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function scoreClass(n){return n==null?"m":n>=90?"g":n>=80?"w":n>=70?"":"b";}
function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));}

let DATA={};
function nav(){const n=$("#nav");TABS.forEach(([id,label],i)=>{const b=el("button",i===0?"active":"",label);b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));$("#t-"+id).classList.add("active");};n.appendChild(b);});$("#t-"+TABS[0][0]).classList.add("active");}

function kpis(items){const g=el("div","grid kpis");items.forEach(([n,l,cls])=>{const k=el("div","kpi");k.appendChild(el("div","n "+(cls||""),n));k.appendChild(el("div","l",l));g.appendChild(k);});return g;}
function note(t){return el("div","note",esc(t));}

function renderResume(d){const c=$("#t-resume");c.innerHTML="";
  const m=d.master||{};
  c.appendChild(kpis([[d.count||0,"resumes generated"],[m.jobs||0,"jobs in master bank"],[(m.summaries||[]).length,"role variants"]]));
  const mc=el("div","card");mc.appendChild(el("h3",null,"Master resume &nbsp;<span class='mut'>"+esc((m.updated||"").slice(0,10))+"</span>"));
  mc.innerHTML+=(m.job_titles||[]).map(t=>"<span class='chip'>"+esc(t)+"</span>").join("");
  c.appendChild(mc);
  const list=el("div","grid cards");(d.resumes||[]).forEach(r=>{const card=el("div","card");
    let s=r.panel_avg!=null?`<span class='score ${scoreClass(r.panel_avg)}'>${r.panel_avg}</span> <span class='mut'>/100 · ${r.interview_votes??"–"}/3 votes</span>`:`<span class='mut'>ungraded</span>`;
    card.innerHTML=`<div class='title'>${esc(r.title)}</div><div class='mut'>${esc((r.updated||"").slice(0,10))} · ${r.kb}kb</div><div style='margin-top:8px'>${s}</div>`;
    if(r.personas){card.innerHTML+=`<div class='mut' style='margin-top:6px'>HM ${r.personas.hiring_manager??"–"} · Rec ${r.personas.recruiter??"–"} · ATS ${r.personas.ai_systems_rep??"–"}</div>`;}
    if(r.keyword_match_pct!=null)card.innerHTML+=`<span class='chip'>kw ${r.keyword_match_pct}%</span>`;
    if(r.ai_risk)card.innerHTML+=`<span class='chip'>AI-risk ${esc(r.ai_risk)}</span>`;
    list.appendChild(card);});
  c.appendChild(list);
}

function renderGoals(d){const c=$("#t-goals");c.innerHTML="";
  const gs=d.goals||[];
  c.appendChild(kpis([[gs.length,"tracked goals"],[gs.filter(g=>g.status==="active").length,"active"],[gs.filter(g=>g.status==="done").length,"done"]]));
  const order={quarterly:0,needle_mover:1,goal:2,requirement:3,blocker:0};
  gs.sort((a,b)=>(order[a.kind]??9)-(order[b.kind]??9));
  const card=el("div","card");
  gs.forEach(g=>{const row=el("div","row");const p=g.progress!=null?g.progress:"";
    row.innerHTML=`<div style='flex:1'><span class='chip'>${esc(g.kind)}</span> <span class='title'>${g.parent?"↳ ":""}${esc(g.title)}</span>
      ${p!==""?`<div class='bar'><i style='width:${p}%'></i></div>`:""}</div>
      <div style='text-align:right;min-width:90px'><span class='pill ${g.status==="done"?"on":"off"}'>${esc(g.status||"")}</span>${p!==""?`<div class='mut'>${p}%</div>`:""}</div>`;
    card.appendChild(row);});
  c.appendChild(gs.length?card:el("div","empty","No goals found."));
}

function renderJobs(d){const c=$("#t-jobs");c.innerHTML="";
  const j=d.jobs||[];
  const boards=(d.sources||[]).filter(s=>s.ok).length;
  const withComp=j.filter(x=>x.comp).length;
  c.appendChild(kpis([[d.total_matched??j.length,"matched roles"],[boards,"boards scouted"],[(((d.search||{}).comp_min)?"$"+((d.search.comp_min)/1000)+"k+":"any"),"comp floor"],[withComp+"/"+j.length,"comp listed"]]));
  if(d.generated)c.appendChild(el("div","mut","last scouted "+esc(d.generated.slice(0,16).replace("T"," "))+" · "+esc(d.note||"")));
  if(!j.length){c.appendChild(note(d.note||"No jobs yet. Run job_scout.py."));return;}
  const wrap=el("div","wrap card");let h="<table><tr><th>Match</th><th>Company</th><th>Role</th><th>Location</th><th>Comp</th></tr>";
  j.forEach(x=>{const role=x.url?`<a href='${esc(x.url)}' target='_blank' style='color:var(--accent);text-decoration:none'>${esc(x.title)}</a>`:esc(x.title);
    h+=`<tr><td class='score ${scoreClass(x.match)}'>${x.match??"–"}</td><td>${esc(x.company)}</td><td>${role}</td><td class='mut'>${esc(x.location||"")}</td><td>${esc(x.comp||"–")}</td></tr>`;});
  wrap.innerHTML=h+"</table>";c.appendChild(wrap);
}

function renderStart(d){const c=$("#t-start");c.innerHTML="";
  const steps=d.steps||[], done=d.done||0, total=d.total||5;
  c.appendChild(kpis([
    [done+"/"+total,"steps complete",done===total?"g":(done?"w":"b")],
    [d.complete?"yes":"no","running end to end",d.complete?"g":"m"],
    [d.next?("step "+d.next):"–","do next"]]));
  const intro=el("div","note","This is your setup walkthrough. Run each command below in your Claude Code session — this page reflects your progress live, so refresh after each step and watch it turn green. This tool prepares your applications; it never submits one for you.");
  c.appendChild(intro);
  if(d.complete){const ok=el("div","card");ok.style.borderColor="var(--good)";
    ok.innerHTML="<h3 style='margin:0'>🎉 You're set — your copilot is running end to end.</h3><div class='mut' style='margin-top:6px'>Open <b>Jobs</b> for matched roles and <b>Resume</b> for your graded resumes. Re-run <code>/recruit:scout</code> anytime for fresh roles, and <code>/recruit:tailor</code> per posting.</div>";
    c.appendChild(ok);}
  steps.forEach(s=>{
    const isNext=!s.done && s.n===d.next;
    const card=el("div","card");
    card.style.cssText="display:flex;gap:14px;align-items:flex-start"+(isNext?";border-color:var(--accent)":"");
    const badge=`<div style="flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:${s.done?'var(--good)':(isNext?'var(--accent)':'var(--panel2)')};color:${s.done||isNext?'#fff':'var(--muted)'}">${s.done?'✓':s.n}</div>`;
    card.innerHTML=`${badge}<div style="flex:1;min-width:0">
      <div class='title'>${esc(s.title)} ${isNext?"<span class='chip' style='background:var(--accent);color:#fff'>do this next</span>":""}</div>
      <div class='mut' style='margin:3px 0 8px'>${esc(s.why)}</div>
      <div>${s.done?"<span class='pill on'>done</span>":"<span class='mut'>run </span><code>"+esc(s.command)+"</code>"} <span class='chip'>${esc(s.detail||"")}</span></div>
    </div>`;
    c.appendChild(card);});
}
const R={start:renderStart,jobs:renderJobs,resume:renderResume,goals:renderGoals,system:renderSystem};
async function load(){
  try{
    const r=await fetch("/api/all");DATA=await r.json();
    $("#sub").textContent="live · "+new Date().toLocaleString();
    const KEY={resume:"resumes",start:"setup"};
    for(const[id]of TABS){try{R[id](DATA[KEY[id]||id]||{});}catch(e){$("#t-"+id).innerHTML="<div class='empty'>render error: "+esc(e.message)+"</div>";}}
  }catch(e){$("#sub").textContent="error loading data: "+e.message;}
}
nav();load();
</script>
</body>
</html>
